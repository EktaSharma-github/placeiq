<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="70" width="1420" height="130" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="54" y="90" font-size="12.5" font-weight="700" fill="#334155">PRESENTATION: browser single-page app (HTML, CSS, vanilla JS)</text><rect x="40" y="250" width="1420" height="140" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="54" y="270" font-size="12.5" font-weight="700" fill="#334155">APPLICATION: FastAPI REST API (app/main.py), bound to 127.0.0.1</text><rect x="40" y="440" width="1420" height="290" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><text x="54" y="460" font-size="12.5" font-weight="700" fill="#0f766e">DATA: PostgreSQL 18, database placeiq, schema placeiq</text><path d="M 750,200 L 750,245" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 750,390 L 750,435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">System architecture</text><rect x="70" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="172" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">Dashboard</text><rect x="298" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="400" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">Students</text><rect x="526" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="628" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">Jobs</text><rect x="754" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="856" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">SQL analytics</text><rect x="982" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="1084" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">Injection lab</text><rect x="1210" y="110" width="205" height="64" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8"/><text x="1312" y="142" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle" dominant-baseline="middle">Audit log</text><text x="765" y="222" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">JSON over HTTP (fetch)</text><rect x="70" y="290" width="320" height="78" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="230" y="318" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">REST endpoints</text><text x="230" y="344" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">/api/students, /jobs, /offers ...</text><rect x="415" y="290" width="320" height="78" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="575" y="318" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Parameterised SQL</text><text x="575" y="344" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">psycopg 3, %s placeholders</text><rect x="760" y="290" width="320" height="78" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="920" y="318" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Error translator</text><text x="920" y="344" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">SQLSTATE + raising trigger</text><rect x="1105" y="290" width="320" height="78" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/><text x="1265" y="318" font-size="14" font-weight="700" fill="#7c2d12" text-anchor="middle" dominant-baseline="middle">Swagger docs</text><text x="1265" y="344" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">/docs</text><text x="765" y="412" font-size="12" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">SQL: SELECT, CALL, fn_apply_for_job(...)</text><rect x="70" y="480" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="285" y="514" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">22 tables</text><text x="285" y="542" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">BCNF, PK / FK / CHECK / EXCLUDE</text><rect x="530" y="480" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="745" y="514" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">2 views</text><text x="745" y="542" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">v_job_details, v_placement_status</text><rect x="990" y="480" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="1205" y="514" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">9 triggers</text><text x="1205" y="542" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">eligibility, one-offer policy, totality</text><rect x="70" y="600" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="285" y="634" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">3 routines</text><text x="285" y="662" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">fn_apply_for_job, sp_accept_offer, sp_expire_stale_offers</text><rect x="530" y="600" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="745" y="634" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">Indexes</text><text x="745" y="662" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">FK indexes, partial index on accepted offers</text><rect x="990" y="600" width="430" height="96" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/><text x="1205" y="634" font-size="15" font-weight="700" fill="#134e4a" text-anchor="middle" dominant-baseline="middle">Role placeiq_readonly</text><text x="1205" y="662" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle">least privilege for the injection lab</text></svg>