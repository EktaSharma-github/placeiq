<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="700" viewBox="0 0 1380 700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 333,150 L 357,150" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 663,150 L 687,150" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 993,150 L 1017,150" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Normalization: from the placement spreadsheet to BCNF</text><text x="180.0" y="76" font-size="15" font-weight="700" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">UNF: spreadsheet</text><text x="180.0" y="98" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-style="italic">anomalies: update, insert, delete</text><rect x="30" y="120" width="300" height="119" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="42" y="137" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" dominant-baseline="middle">PLACEMENT_SHEET</text><text x="42" y="158" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, name, email, prog_code,</text><text x="42" y="175" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">prog_name, cgpa, {skills}, company,</text><text x="42" y="192" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">sector, hq_city, cycle, job_title,</text><text x="42" y="209" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">role_type, pay, min_cgpa, round_no,</text><text x="42" y="226" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">round_type, slot, result, app_status</text><text x="510.0" y="76" font-size="15" font-weight="700" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">1NF: atomic values</text><text x="510.0" y="98" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-style="italic">split multi-valued {skills}</text><rect x="360" y="120" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="372" y="137" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">STUDENT_SKILL</text><text x="372" y="158" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, skill</text><rect x="360" y="181" width="300" height="68" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="372" y="198" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">SHEET_1NF</text><text x="372" y="219" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, company, cycle, job_title,</text><text x="372" y="236" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">round_no + 15 non-key attributes</text><text x="840.0" y="76" font-size="15" font-weight="700" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">2NF: no partial dependency</text><text x="840.0" y="98" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-style="italic">remove partial deps (FD1, FD4, FD5, FD7)</text><rect x="690" y="120" width="300" height="68" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="137" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">STUDENT</text><text x="702" y="158" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, name, email, prog_code,</text><text x="702" y="175" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">prog_name, cgpa</text><rect x="690" y="198" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="215" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">COMPANY</text><text x="702" y="236" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">company, sector, hq_city</text><rect x="690" y="259" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="276" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">JOB</text><text x="702" y="297" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">company, cycle, job_title, role_type, pay</text><rect x="690" y="320" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="337" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">ROUND</text><text x="702" y="358" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">J, round_no, round_type</text><rect x="690" y="381" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="398" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">APPLICATION</text><text x="702" y="419" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, J, app_status, min_cgpa</text><rect x="690" y="442" width="300" height="51" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="702" y="459" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="start" dominant-baseline="middle">INTERVIEW</text><text x="702" y="480" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, J, round_no, slot, result</text><text x="1185.0" y="76" font-size="15" font-weight="700" fill="#4f46e5" text-anchor="middle" dominant-baseline="middle">3NF = BCNF: no transitive dependency</text><text x="1185.0" y="98" font-size="12" font-weight="400" fill="#64748b" text-anchor="middle" dominant-baseline="middle" font-style="italic">remove transitive deps (FD3, FD6)</text><rect x="1020" y="120" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="137" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">STUDENT</text><text x="1032" y="158" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, name, email, prog_code, cgpa</text><rect x="1020" y="181" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="198" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">PROGRAM</text><text x="1032" y="219" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">prog_code, prog_name</text><rect x="1020" y="242" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="259" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">COMPANY</text><text x="1032" y="280" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">company, sector, hq_city</text><rect x="1020" y="303" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="320" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">JOB</text><text x="1032" y="341" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">J, role_type, pay</text><rect x="1020" y="364" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="381" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">ELIGIBILITY</text><text x="1032" y="402" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">J, prog_code, min_cgpa</text><rect x="1020" y="425" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="442" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">ROUND</text><text x="1032" y="463" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">J, round_no, round_type</text><rect x="1020" y="486" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="503" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">APPLICATION</text><text x="1032" y="524" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, J, app_status</text><rect x="1020" y="547" width="330" height="51" rx="10" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="1032" y="564" font-size="13" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">INTERVIEW</text><text x="1032" y="585" font-size="11.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">roll_no, J, round_no, slot, result</text><text x="30" y="640" font-size="13" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">Every split X→Y produces (X∪Y) and (R−Y), with X a key of the first part, so it is lossless (Heath&#x27;s theorem). FD1–FD9 each remain inside one table, so it is dependency-preserving.</text><text x="30" y="668" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">J = (company, cycle, job_title), later replaced by the surrogate job_id; the natural key stays UNIQUE.</text></svg>