<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><path d="M 400,128 L 400,152" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 400,228 L 400,252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 400,328 L 400,352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 400,428 L 400,452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 400,528 L 400,552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><path d="M 720,590 L 790,590" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-linejoin="round"/><text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">Accepting an offer: one transaction, three layers of protection</text><rect x="80" y="54" width="640" height="74" rx="12" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="110" y="80" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">CALL sp_accept_offer(offer_id)</text><text x="110" y="105" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">stored procedure</text><rect x="80" y="154" width="640" height="74" rx="12" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="110" y="180" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Lock the student row (SELECT ... FOR UPDATE)</text><text x="110" y="205" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">concurrent acceptances for the same student queue here</text><rect x="80" y="254" width="640" height="74" rx="12" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="110" y="280" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Re-read the offer under the lock: still PENDING?</text><text x="110" y="305" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">else: raise &#x27;only a PENDING offer can be accepted&#x27;</text><rect x="80" y="354" width="640" height="74" rx="12" fill="#eef0ff" stroke="#4f46e5" stroke-width="1.8"/><text x="110" y="380" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">UPDATE offer SET status = &#x27;ACCEPTED&#x27;</text><text x="110" y="405" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">fires the triggers below</text><rect x="80" y="454" width="640" height="74" rx="12" fill="#fff4e6" stroke="#c2410c" stroke-width="1.8"/><text x="110" y="480" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">BEFORE trigger: trg_offer_accept_guard</text><text x="110" y="505" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">deadline not passed? no other ACCEPTED offer in this cycle?</text><rect x="80" y="554" width="640" height="74" rx="12" fill="#fff4e6" stroke="#c2410c" stroke-width="1.8"/><text x="110" y="580" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">AFTER trigger: trg_offer_accept_cascade</text><text x="110" y="605" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">runs in the SAME transaction</text><rect x="800" y="470" width="640" height="240" rx="12" fill="#e6f6f3" stroke="#0f766e" stroke-width="1.8"/><text x="830" y="500" font-size="15" font-weight="700" fill="#0f766e" text-anchor="start" dominant-baseline="middle">Cascade (inside the same transaction)</text><text x="830" y="545" font-size="13.5" font-weight="400" fill="#134e4a" text-anchor="start" dominant-baseline="middle">1. Decline the student&#x27;s other PENDING offers in the cycle</text><text x="830" y="583" font-size="13.5" font-weight="400" fill="#134e4a" text-anchor="start" dominant-baseline="middle">2. Withdraw their open applications in the cycle</text><text x="830" y="621" font-size="13.5" font-weight="400" fill="#134e4a" text-anchor="start" dominant-baseline="middle">3. Delete their SCHEDULED interviews for other jobs</text><text x="830" y="659" font-size="13.5" font-weight="400" fill="#134e4a" text-anchor="start" dominant-baseline="middle">4. Write OFFER_ACCEPTED / AUTO_* rows to placement_log</text><rect x="80" y="680" width="640" height="130" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="110" y="712" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start" dominant-baseline="middle">Atomicity</text><text x="110" y="742" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">COMMIT keeps everything; any error or ROLLBACK undoes every step,</text><text x="110" y="766" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start" dominant-baseline="middle">including the cascade. The student never ends up half-placed.</text><text x="110" y="790" font-size="12.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">Verified by tests TC-TXN-01 to TC-TXN-03.</text><rect x="800" y="90" width="640" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8"/><text x="830" y="122" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" dominant-baseline="middle">Why the lock order matters (concurrency)</text><text x="830" y="162" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">Session A and B accept two offers for the SAME student.</text><text x="830" y="192" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">Both lock the student row first, so B waits for A.</text><text x="830" y="222" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">A commits, and its trigger has already DECLINED B&#x27;s offer.</text><text x="830" y="252" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">B wakes up, re-reads its offer, sees DECLINED, and aborts.</text><text x="830" y="282" font-size="13.5" font-weight="400" fill="#334155" text-anchor="start" dominant-baseline="middle">Result: exactly one accepted offer. Never two.</text><text x="830" y="312" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle"></text><text x="830" y="342" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">Locking the offer row first could deadlock: each session</text><text x="830" y="372" font-size="13.5" font-weight="400" fill="#64748b" text-anchor="start" dominant-baseline="middle">holds one offer that the other&#x27;s cascade needs.</text></svg>